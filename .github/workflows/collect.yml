name: 구글 데이터 수집

# 매시간: GA4 실시간(최근 30분)·하이닥 사이트맵
# 매일 오전 9시(KST): Search Console·기사 크롤링·네이버 발행/기자·트렌드·GA4 연령/성별
# 처음 실행할 때는 Search Console 최근 90일을 한꺼번에 채웁니다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      what:
        description: "무엇을 수집할까요 (auto / all / gsc / articles / naver / hidoc / trends / realtime / demo)"
        default: "all"
      days:
        description: "Search Console·GA4 몇 일치 (처음엔 90)"
        default: "5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: 수집
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python collector/collect.py "${{ github.event.inputs.what || 'auto' }}" --days "${{ github.event.inputs.days || '5' }}"
      - name: 저장
        run: |
          git config user.name "google-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "데이터 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main && git push
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
